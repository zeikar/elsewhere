name: Soak

# The full long-run soak (docs/PLAN.md section 9, Phase 1/3 "Done when", and section 10: after 30
# minutes, memory and frame rate have not degraded), on demand. CI runs a 3-minute version on every
# push (ci.yml). The report is uploaded as the soak-report artifact.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak length in minutes (1–120)
        type: number
        required: true
        default: 30

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    # Room for the longest allowed soak plus setup.
    timeout-minutes: 150
    env:
      SOAK_MINUTES: ${{ inputs.minutes }}
    steps:
      - name: Check the soak length
        run: |
          if ! [[ "$SOAK_MINUTES" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk -v m="$SOAK_MINUTES" 'BEGIN { exit !(m >= 1 && m <= 120) }'; then
            echo "::error::minutes must be a number from 1 to 120, got '$SOAK_MINUTES'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run soak

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
