name: Deploy

# Builds the site and publishes it to GitHub Pages at https://zeikar.dev/elsewhere/ (docs/PLAN.md
# section 3). Pages must use "GitHub Actions" as its source. No CNAME file: the custom domain comes
# from the owner's user site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. An in-progress deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only. configure-pages reads the Pages site config, which needs pages: read.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Asset paths must resolve under /elsewhere/ (docs/PLAN.md section 10).
      - run: npm run check:base

      # The production build must not contain the e2e test hook.
      - run: npm run check:hook

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets the Pages write and OIDC token scopes; the build job (which runs npm ci) does not.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
